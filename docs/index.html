<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.workers.dev http://localhost:8787; img-src 'self' data: https://i.ytimg.com https://*.cdninstagram.com https://*.fbcdn.net">
<meta name="referrer" content="no-referrer">
<title>語音助手</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#fffaf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>✏️ 語音助手</h1>

  <section id="login" hidden>
    <p>請輸入 APP 密碼</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼">
    <button id="loginBtn">登入</button>
  </section>

  <section id="app" hidden>
    <div class="tabs">
      <button class="tab on" data-tab="note">📁 專案庫</button>
      <button class="tab" data-tab="plan">✅ 任務庫</button>
      <button class="tab" data-tab="video">📚 知識庫</button>
    </div>

    <div id="tab-note">
      <textarea id="text" rows="6" placeholder="專案點子或規劃，打字或按麥克風用說的"></textarea>
      <div class="row">
        <button class="ghost mic" data-for="text">🎤 說話</button>
        <button id="saveBtn">存到 Notion</button>
      </div>
      <label class="tpl">資料庫範本<select id="tpl-projects"><option value="">不用範本</option></select></label>
      <details class="more"><summary>更多欄位（專案狀態、種類、執行日期…）</summary><div class="fields" id="fields-projects"></div></details>
    </div>

    <div id="tab-plan" hidden>
      <textarea id="planText" rows="3" placeholder="例如：明天下午3點開會、2分鐘後提醒我喝水"></textarea>
      <div class="row">
        <button class="ghost mic" data-for="planText">🎤 說話</button>
        <button id="parseBtn">看懂這句</button>
      </div>
      <div id="planForm" class="card" hidden>
        <label>要做什麼<input id="planTitle"></label>
        <label>時間<input id="planAt" type="datetime-local"></label>
        <label>提醒
          <select id="planBefore">
            <option value="0">準時提醒</option>
            <option value="5">提前 5 分鐘</option>
            <option value="15">提前 15 分鐘</option>
            <option value="30">提前 30 分鐘</option>
            <option value="60">提前 1 小時</option>
            <option value="-1">不用提醒</option>
          </select>
        </label>
        <div class="fields" id="fields-tasks"></div>
        <label>資料庫範本<select id="tpl-tasks"><option value="">不用範本</option></select></label>
        <button id="planSaveBtn">存到 Notion</button>
      </div>
      <p class="small" id="pushRow"><button id="pushBtn" class="ghost">🔔 開啟提醒通知</button> <a href="#" id="pushTestBtn">送一則測試通知</a></p>
    </div>

    <div id="tab-video" hidden>
      <input id="videoUrl" inputmode="url" placeholder="貼上 YouTube 或 IG 網址">
      <p class="small hint">小技巧：在 YouTube／IG 按「分享」→ 選「語音助手」，網址會自動帶進來</p>
      <div class="row"><span></span><button id="videoPreviewBtn">抓影片資料</button></div>
      <div id="videoForm" class="card" hidden>
        <img id="videoThumb" alt="" hidden>
        <label>標題<input id="videoTitle"></label>
        <p class="small" id="videoMeta"></p>
        <div class="fields" id="fields-knowledge"></div>
        <label>資料庫範本
          <select id="tpl-knowledge"><option value="">（讀取中…）</option></select>
        </label>
        <button id="videoSaveBtn">存到知識庫</button>
      </div>
      <p id="videoDone" hidden><a id="videoOpen" href="#" target="_blank" rel="noopener">👉 打開 Notion 查看</a></p>
    </div>

    <p class="small"><a href="#" id="checkBtn">檢查 Notion 連線</a> · <a href="#" id="logoutBtn">登出</a></p>
  </section>

  <p id="msg" role="status"></p>
</main>
<script src="config.js"></script>
<script src="fields.js"></script>
<script src="app.js"></script>
</body>
</html>
